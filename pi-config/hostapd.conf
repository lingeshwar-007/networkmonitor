# /etc/hostapd/hostapd.conf
# GuardSpot Raspberry Pi Wi-Fi Access Point Configuration

interface=wlan0
driver=nl80211
ssid=GuardSpot_Hotspot
hw_mode=g
channel=7
wmm_enabled=0

# Layer 2 MAC address control:
# macaddr_acl=0: Accept all connections EXCEPT those in deny_mac_file
macaddr_acl=0
deny_mac_file=/etc/hostapd/hostapd.deny

# Authentication & Security
auth_algs=1
ignore_broadcast_ssid=0
wpa=2
wpa_passphrase=GuardSpotSecure123
wpa_key_mgmt=WPA-PSK
wpa_pairwise=TKIP
rsn_pairwise=CCMP
