{% extends "base.html" %}
{% block title %}GuardSpot — Login{% endblock %}
{% block body %}
<div class="login-wrap">
  <form class="login-card" method="POST">
    <div class="login-mark">GS</div>
    <h1>GuardSpot</h1>
    <p class="login-sub">Network Monitor & Gateway Firewall</p>
    {% if error %}<div class="login-error">{{ error }}</div>{% endif %}

    <label>Remote Host / Pi IP (Optional)</label>
    <input type="text" name="pi_ip" placeholder="Leave blank for local hotspot (StrawHats)">

    <div class="auth-toggle">
      <label><input type="radio" name="auth_method" value="password" checked onclick="toggleAuth('password')"> Password</label>
      <label><input type="radio" name="auth_method" value="key" onclick="toggleAuth('key')"> SSH key</label>
    </div>

    <div id="password-field">
      <label>Password</label>
      <input type="password" name="password" placeholder="luffy056">
    </div>

    <div id="key-field" style="display:none;">
      <label>Path to private key</label>
      <input type="text" name="key_path" placeholder="C:\Users\You\.ssh\id_rsa">
    </div>

    <button type="submit">Sign In / Connect</button>
  </form>
</div>
<script>
function toggleAuth(mode) {
  document.getElementById("password-field").style.display = mode === "password" ? "block" : "none";
  document.getElementById("key-field").style.display = mode === "key" ? "block" : "none";
}
</script>
{% endblock %}
